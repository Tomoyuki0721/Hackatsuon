name: 週次イベント情報収集

on:
  schedule:
    # 毎週月曜日 09:00 JST (= UTC 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 手動実行ボタン（テスト用）

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: |
          pip install -q requests beautifulsoup4 lxml feedparser python-dateutil

      - name: イベント情報を収集
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/fetch_events.py

      - name: data/events.json をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet && echo "変更なし" || \
            git commit -m "chore: 週次イベント情報更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git push
